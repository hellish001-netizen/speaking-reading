<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GrammarLab: differentiated, interactive English grammar learning for junior secondary students." />
  <title>GrammarLab | Learn, Practice, Master</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">G</div>
        <div>
          <h1>GrammarLab</h1>
          <p>Learn → Practice → Master</p>
        </div>
      </div>

      <div class="sidebar-summary" aria-label="Overall progress">
        <div class="progress-label">
          <span>Mastery</span>
          <strong id="progressText">0%</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="masteryText">0 of 6 lessons mastered</p>
      </div>

      <nav id="lessonNav" aria-label="Grammar lessons"></nav>

      <div class="sidebar-footer">
        <button class="ghost-btn" id="resetProgressBtn" type="button">Reset student progress</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open lesson menu">☰</button>
        <div>
          <p class="eyebrow">GRADE 9 ENGLISH • DIFFERENTIATED PRACTICE</p>
          <h2 id="pageTitle">Grammar Lesson</h2>
        </div>
        <button class="text-btn" id="teacherModeBtn" type="button" aria-pressed="false">Teacher notes: Off</button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
      </header>

      <section id="lessonView" class="content-view" aria-live="polite"></section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
