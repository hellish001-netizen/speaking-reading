<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive English grammar teaching media for junior secondary students." />
  <title>GrammarLab | Interactive English Grammar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <h1>GrammarLab</h1>
          <p>English Teaching Media</p>
        </div>
      </div>

      <nav id="lessonNav" aria-label="Grammar lessons"></nav>

      <div class="sidebar-footer">
        <div class="progress-label">
          <span>Learning progress</span>
          <strong id="progressText">0%</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <button class="ghost-btn" id="resetProgressBtn" type="button">Reset progress</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open lesson menu">☰</button>
        <div>
          <p class="eyebrow">GRADE 9 ENGLISH</p>
          <h2 id="pageTitle">Grammar Lesson</h2>
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
      </header>

      <section id="lessonView" class="content-view"></section>
    </main>
  </div>

  <template id="lessonTemplate">
    <article class="lesson-card">
      <div class="lesson-hero">
        <div>
          <span class="lesson-tag"></span>
          <h2 class="lesson-title"></h2>
          <p class="lesson-summary"></p>
        </div>
        <div class="lesson-icon" aria-hidden="true"></div>
      </div>

      <div class="learning-grid">
        <section class="panel">
          <h3>When do we use it?</h3>
          <ul class="use-list"></ul>
        </section>
        <section class="panel formula-panel">
          <h3>Basic pattern</h3>
          <div class="formula-box"></div>
        </section>
      </div>

      <section class="panel">
        <div class="section-heading">
          <div>
            <span class="mini-label">EXAMPLES</span>
            <h3>See the grammar in action</h3>
          </div>
        </div>
        <div class="example-list"></div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <span class="mini-label">PRACTICE</span>
            <h3>Try it yourself</h3>
          </div>
          <span class="score-badge practice-score">0 / 0</span>
        </div>
        <div class="practice-list"></div>
        <button class="primary-btn check-practice-btn" type="button">Check answers</button>
        <div class="feedback-box practice-feedback" hidden></div>
      </section>

      <section class="panel tip-panel">
        <div class="tip-icon">💡</div>
        <div>
          <h3>Quick teacher tip</h3>
          <p class="teacher-tip"></p>
        </div>
      </section>

      <div class="lesson-actions">
        <button class="secondary-btn prev-btn" type="button">← Previous</button>
        <button class="primary-btn complete-btn" type="button">Mark lesson complete</button>
        <button class="secondary-btn next-btn" type="button">Next →</button>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
